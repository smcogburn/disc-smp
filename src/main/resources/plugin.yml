name: DiscSMP
main: com.example.discsmp.DiscSMPPlugin
version: 1.0.0
api-version: '1.21'
description: The Disc SMP - 10 unique discs, shrine crafting, and the ritual of the ten songs.
commands:
  discsmp:
    description: Disc SMP admin command
    usage: /discsmp <setshrine|locate|give|status|reset|reroll>
    permission: discsmp.admin
  discs:
    description: Show the status of the ten discs
    usage: /discs
  team:
    description: Create and manage your disc-sharing team
    usage: /team <create|invite|accept|leave|kick|rename|glow|disband|list>
permissions:
  discsmp.admin:
    description: Disc SMP admin tools
    default: op
